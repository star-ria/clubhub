{# usage: {% from "_password_meter.html" import meter %}{{ meter('password') }} — place right after the password input #}
{% macro meter(field_id) %}
<div id="pw-meter" class="meter" hidden aria-live="polite"><div class="meter-track"><div class="meter-bar" id="pw-bar"></div></div>
<div id="pw-label" class="hint"></div><ul id="pw-tips" class="hint tips"></ul></div>
<script>
(function(){var input=document.getElementById('{{ field_id }}'),box=document.getElementById('pw-meter'),bar=document.getElementById('pw-bar'),
label=document.getElementById('pw-label'),tips=document.getElementById('pw-tips'),form=input.form,timer;
var colors=['#b3261e','#c75a1a','#b08900','#3f8f4f','#1f7a4d'];
function run(){var p=input.value;if(!p){box.hidden=true;return;}var fd=new FormData();
fd.append('csrf_token',form.querySelector('[name=csrf_token]').value);fd.append('password',p);
['email','name'].forEach(function(n){var e=form.querySelector('[name='+n+']');if(e)fd.append(n,e.value);});
fetch('{{ url_for("password_check") }}',{method:'POST',body:fd}).then(function(r){return r.json();}).then(function(d){
box.hidden=false;bar.style.width=((d.score+1)*20)+'%';bar.style.background=colors[d.score];
label.textContent='Strength: '+d.label;tips.innerHTML='';d.errors.concat(d.suggestions).forEach(function(t){var li=document.createElement('li');li.textContent=t;tips.appendChild(li);});}).catch(function(){});}
input.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(run,250);});})();
</script>{% endmacro %}
