{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="card" style="max-width:420px;margin:auto"><h1>Log in</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" required>
<p><button>Log in</button></p>
<p class="hint">New here? <a href="{{ url_for('signup') }}">Create an account</a></p></form></div>{% endblock %}
