{% extends "base.html" %}{% block title %}Two-factor sign-in{% endblock %}
{% block content %}<div class="card" style="max-width:420px;margin:auto"><h1>Two-factor authentication</h1>
<p>Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="code">Code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required>
<p><button>Verify</button> <a href="{{ url_for('login') }}">Start over</a></p></form></div>{% endblock %}
